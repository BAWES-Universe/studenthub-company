<!------------------ text-list -------------------->

<div class="text-list" *ngIf="loading && type == 'text-list'">
  <ion-list>
    <ion-item><div tabindex="0"></div>
      <ion-skeleton-text></ion-skeleton-text>
    </ion-item>
    <ion-item><div tabindex="0"></div>
      <ion-skeleton-text></ion-skeleton-text>
    </ion-item>
    <ion-item><div tabindex="0"></div>
      <ion-skeleton-text></ion-skeleton-text>
    </ion-item>
    <ion-item><div tabindex="0"></div>
      <ion-skeleton-text></ion-skeleton-text>
    </ion-item>
  </ion-list>
</div>

<div class="candidate-list" *ngIf="loading && type == 'candidate-list'">
  <ion-list>
    <ion-item><div tabindex="0"></div>
      <ion-avatar slot="start">
        <ion-skeleton-text animated></ion-skeleton-text>
      </ion-avatar>
      <ion-label>
        <h3>
          <ion-skeleton-text animated style="width: 50%"></ion-skeleton-text>
        </h3>
        <p>
          <ion-skeleton-text animated style="width: 60%"></ion-skeleton-text>
        </p>
      </ion-label>
    </ion-item>
    <ion-item><div tabindex="0"></div>
      <ion-avatar slot="start">
        <ion-skeleton-text animated></ion-skeleton-text>
      </ion-avatar>
      <ion-label>
        <h3>
          <ion-skeleton-text animated style="width: 50%"></ion-skeleton-text>
        </h3>
        <p>
          <ion-skeleton-text animated style="width: 80%"></ion-skeleton-text>
        </p>
      </ion-label>
    </ion-item>
    <ion-item><div tabindex="0"></div>
      <ion-avatar slot="start">
        <ion-skeleton-text animated></ion-skeleton-text>
      </ion-avatar>
      <ion-label>
        <h3>
          <ion-skeleton-text animated style="width: 50%"></ion-skeleton-text>
        </h3>
        <p>
          <ion-skeleton-text animated style="width: 80%"></ion-skeleton-text>
        </p>
      </ion-label>
    </ion-item>
    <ion-item><div tabindex="0"></div>
      <ion-avatar slot="start">
        <ion-skeleton-text animated></ion-skeleton-text>
      </ion-avatar>
      <ion-label>
        <h3>
          <ion-skeleton-text animated style="width: 50%"></ion-skeleton-text>
        </h3>
        <p>
          <ion-skeleton-text animated style="width: 80%"></ion-skeleton-text>
        </p>
      </ion-label>
    </ion-item>
  </ion-list>
</div>

<div class="text-list-view" *ngIf="loading && type == 'text-list-view'">
  <ion-list>
    <ion-item><div tabindex="0"></div>
      <ion-label>
        <h5><ion-skeleton-text></ion-skeleton-text></h5>
        <p><ion-skeleton-text></ion-skeleton-text></p>
      </ion-label>
    </ion-item>
    <ion-item><div tabindex="0"></div>
      <ion-label>
        <h5><ion-skeleton-text></ion-skeleton-text></h5>
        <p><ion-skeleton-text></ion-skeleton-text></p>
      </ion-label>
    </ion-item>
    <ion-item><div tabindex="0"></div>
      <ion-label>
        <h5><ion-skeleton-text></ion-skeleton-text></h5>
        <p><ion-skeleton-text></ion-skeleton-text></p>
      </ion-label>
    </ion-item>
    <ion-item><div tabindex="0"></div>
      <ion-label>
        <h5><ion-skeleton-text></ion-skeleton-text></h5>
        <p><ion-skeleton-text></ion-skeleton-text></p>
      </ion-label>
    </ion-item>
    <ion-item><div tabindex="0"></div>
      <ion-label>
        <h5><ion-skeleton-text></ion-skeleton-text></h5>
        <p><ion-skeleton-text></ion-skeleton-text></p>
      </ion-label>
    </ion-item>
    <ion-item><div tabindex="0"></div>
      <ion-label>
        <h5><ion-skeleton-text></ion-skeleton-text></h5>

      </ion-label>
    </ion-item>
  </ion-list>
</div>

<div class="candidate-detail" *ngIf="loading && type == 'candidate-detail'">
  <ion-item-group>
    <ion-item><div tabindex="0"></div>
      <ion-avatar slot="start">
        <ion-skeleton-text animated></ion-skeleton-text>
      </ion-avatar>
      <ion-label>
        <h2><ion-skeleton-text animated></ion-skeleton-text></h2>
        <p><ion-skeleton-text animated></ion-skeleton-text></p>
        <p><ion-skeleton-text animated></ion-skeleton-text></p>
      </ion-label>
    </ion-item>
    <ion-item target='_blank'>
      <div tabindex="0"></div>
      <ion-icon name="call" slot="start"></ion-icon>
      <ion-label><ion-skeleton-text animated></ion-skeleton-text></ion-label>
    </ion-item>
    <ion-item target='_blank'>
      <div tabindex="0"></div>
      <ion-icon name="mail" slot="start"></ion-icon>
      <ion-label><ion-skeleton-text animated></ion-skeleton-text></ion-label>
    </ion-item>

    <ion-item><div tabindex="0"></div>
      <ion-icon name="pin" slot="start"></ion-icon>
      <ion-label><ion-skeleton-text animated></ion-skeleton-text></ion-label>
    </ion-item>

    <ion-item-divider color="light">Store Assignment</ion-item-divider>
    <ion-item><div tabindex="0"></div>
        <ion-skeleton-text animated></ion-skeleton-text>
    </ion-item>
    
    <ion-item>
      <div tabindex="0"></div>
      <ion-skeleton-text animated></ion-skeleton-text>
    </ion-item>
    <ion-item-divider color="light">Personal</ion-item-divider>
    <ion-item><div tabindex="0"></div>
      <ion-label>
        <h5>Age</h5>
        <p><ion-skeleton-text animated></ion-skeleton-text></p>
      </ion-label>
    </ion-item>
    <ion-item><div tabindex="0"></div>
      <ion-label>
        <h5>Nationality</h5>
        <p><ion-skeleton-text animated></ion-skeleton-text></p>
      </ion-label>
    </ion-item>
    <ion-item><div tabindex="0"></div>
      <ion-label>
        <h5>University</h5>
        <p><ion-skeleton-text animated></ion-skeleton-text></p>
      </ion-label>
    </ion-item>
    <ion-item-divider color="light">Civil ID</ion-item-divider>
    <ion-item><div tabindex="0"></div>
      <ion-label>
        <h5>Civil ID Number</h5>
        <p><ion-skeleton-text animated></ion-skeleton-text></p>
      </ion-label>
    </ion-item>
    <ion-item><div tabindex="0"></div>
      <ion-label>
        <h5>Birth date</h5>
        <p><ion-skeleton-text animated></ion-skeleton-text></p>
      </ion-label>
    </ion-item>
    <ion-item><div tabindex="0"></div>
      <ion-label>
        <h5>Expiry Date</h5>
        <p><ion-skeleton-text animated></ion-skeleton-text></p>
      </ion-label>
    </ion-item>
    <ion-item><div tabindex="0"></div>
      <ion-label>
        <h5>ID Photo Front</h5>
        <p>
          <a target='_blank'>
            <ion-skeleton-text animated></ion-skeleton-text>
          </a>
        </p>
      </ion-label>
    </ion-item>
    <ion-item><div tabindex="0"></div>
      <ion-label>
        <h5>ID Photo Back</h5>
        <p>
          <a target='_blank'>
            <ion-skeleton-text animated></ion-skeleton-text>
          </a>
        </p>
      </ion-label>
    </ion-item>
  </ion-item-group>
</div>

<div class="transfer-view" *ngIf="loading && type == 'transfer-view'">
  <div class="ion-text-center ion-padding">
    <h2 class="ion-text-center">
      <ion-skeleton-text animated></ion-skeleton-text>
    </h2>
    <div><ion-skeleton-text animated></ion-skeleton-text></div>
  </div>

  <div>
    <ion-grid>
      <ion-row>
        <ion-col size-lg="3" size-md="3" size-sm="6" size-xs="6" class="ion-align-self-center">
          <ion-skeleton-text animated></ion-skeleton-text>
        </ion-col>
        <ion-col size-lg="3" size-md="3" size-sm="6" size-xs="6"  class="ion-align-self-center">
          <ion-skeleton-text animated></ion-skeleton-text>
        </ion-col>
        <ion-col size-lg="3" size-md="3" size-sm="6" size-xs="6"  class="ion-align-self-center">
          <ion-skeleton-text animated></ion-skeleton-text>
        </ion-col>
        <ion-col size-lg="3" size-md="3"  size-sm="6" size-xs="6" class="ion-align-self-center">
          <ion-skeleton-text animated></ion-skeleton-text>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>

  <!--Invoices -->
  <div class="invoices">
    <h4>Invoices</h4>
    <ion-list>
      <ion-item><div tabindex="0"></div>
        <ion-skeleton-text animated></ion-skeleton-text>
      </ion-item>
      <ion-item><div tabindex="0"></div>
        <ion-skeleton-text animated></ion-skeleton-text>
      </ion-item>
    </ion-list>
  </div>

  <!-- Receipts -->
  <div class="receipts">
    <h4>Receipts</h4>
    <ion-list>
      <ion-item><div tabindex="0"></div>
        <ion-skeleton-text animated></ion-skeleton-text>
      </ion-item>
      <ion-item><div tabindex="0"></div>
        <ion-skeleton-text animated></ion-skeleton-text>
      </ion-item>
    </ion-list>
  </div>

  <!-- Transfer Details made to each Candidate -->
  <ion-list>
    <!-- store_name pipe returns the transferCandidates grouped by store as object of following format: -->
    <!-- {name: string, resources: TransferCandidate[]} -->
    <ion-item-group>
      <ion-item-divider><b><ion-skeleton-text animated></ion-skeleton-text></b></ion-item-divider>

      <ion-item><div tabindex="0"></div>
        <ion-avatar slot="start">
          <ion-skeleton-text animated></ion-skeleton-text>
        </ion-avatar>
        <ion-label>
          <h2><ion-skeleton-text animated></ion-skeleton-text></h2>

          <p><ion-skeleton-text animated></ion-skeleton-text></p>
          <p><ion-skeleton-text animated></ion-skeleton-text></p>
          <p><b><ion-skeleton-text animated></ion-skeleton-text></b></p>
        </ion-label>
      </ion-item>
    </ion-item-group>
  </ion-list>
</div>
