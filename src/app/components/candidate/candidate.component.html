  <ion-item>
    <div tabindex="0"></div>

    <ion-avatar slot="start">
      <img *ngIf="candidate.candidate_personal_photo"
        src="{{ aws.cloudinaryUrl + 'candidate-photo/' + candidate.candidate_personal_photo }}" onerror="this.src='/assets/icon.png';">
      <img *ngIf="candidate && !candidate.candidate_personal_photo" src="/assets/icon.png">
    </ion-avatar>

    <ion-label>
      <h2 class="candidate_name">{{ candidate.candidate_name ?candidate.candidate_name : candidate.candidate_name_ar }}</h2>

      <!--
      <ion-badge *ngIf="candidate.approved == 0 && candidate.isProfileCompleted == true" color="warning">
        Requires Approval
      </ion-badge>
      -->

      <ion-badge *ngIf="candidate.isProfileCompleted == false" color="danger">
        Incomplete Profile
      </ion-badge>

      <ion-badge *ngIf="!candidate.candidate_email_verification" color="danger">
        Email Not Verified
      </ion-badge>

      <ng-container *ngIf="invitation">
        <ion-badge *ngIf="invitation && invitation.invitation_status == 1" color="warning">
          Invited
        </ion-badge>
        <ion-badge *ngIf="invitation && invitation.invitation_status == 3" color="warning">
          Invitation Accepted
        </ion-badge>
        <ion-badge *ngIf="invitation && invitation.invitation_status == 2" color="danger">
          Invitation Rejected
        </ion-badge>
      </ng-container>

    </ion-label>

  </ion-item>
