<ion-card>
  <ion-badge>
    {{ activity.note_type }}
  </ion-badge>

  <p class="activity">
    <b *ngIf="activity.updatedBy">{{ activity.updatedBy.staff_name?activity.updatedBy.staff_name: activity.updatedBy.candidate_name }}:&nbsp;</b>
    <ng-container><span [innerHTML]="activity.note_text"></span></ng-container>
  </p>

  <p class="txt-time">
    {{ activity.note_updated_datetime | timeAgo }} {{"on" | translate}}
    {{ toDate(activity.note_created_datetime) | date: 'MMM d, y' }}
  </p>
</ion-card>
