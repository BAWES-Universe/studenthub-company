<ion-app>
  <ion-split-pane contentId="main-content">
    <ion-menu contentId="main-content" type="overlay" [disabled]="!auth.isLogged || !auth.navEnable">
      <ion-header>
        <ion-toolbar class=" navi-header ion-text-center" style="height:auto;">
          <img class='logo' src="assets/icon.png" />
          <h3>Studenthub Payroll</h3>
          <h3>Welcome {{auth.name}}</h3>
        </ion-toolbar>
      </ion-header>
      <ion-content>

        <ion-list>
          <ion-menu-toggle auto-hide="false">
            <ion-item [routerLink]="'/transfer-list'" routerLinkActive="active">
              <div tabindex="0"></div>
              <ion-icon name="repeat-outline" slot="start"></ion-icon>
              <ion-label>
                Transfers
              </ion-label>
            </ion-item>
          </ion-menu-toggle>

          <ion-menu-toggle auto-hide="false">
            <ion-item [routerLink]="'/candidate-list'" routerLinkActive="active">
              <div tabindex="0"></div>
              <ion-icon name="person-outline"  slot="start"></ion-icon>
              <ion-label>
                Employees
              </ion-label>
              <ion-badge slot="end" *ngIf="totalEmployees">
                {{ totalEmployees }}
              </ion-badge>
            </ion-item>
          </ion-menu-toggle>

          <ion-menu-toggle auto-hide="false">
            <ion-item [routerLink]="'/candidate-search'" routerLinkActive="active">
              <div tabindex="0"></div>
              <ion-icon name="people-outline"  slot="start"></ion-icon>
              <ion-label>
                Candidate Search
              </ion-label>
            </ion-item>
          </ion-menu-toggle>

          <ion-menu-toggle auto-hide="false">
            <ion-item [routerLink]="'/store-list'" routerLinkActive="active">
              <div tabindex="0"></div>
              <ion-icon name="list-outline"  slot="start"></ion-icon>
              <ion-label>
                Stores
              </ion-label>
            </ion-item>
          </ion-menu-toggle>

          <ion-menu-toggle auto-hide="false">
            <ion-item [routerLink]="'/request-list'" routerLinkActive="active">
              <div tabindex="0"></div>
              <ion-icon name="chatbubble-outline" slot="start"></ion-icon>
              <ion-label>
                Requests
              </ion-label>
            </ion-item>
          </ion-menu-toggle>

          <ion-menu-toggle auto-hide="false">
            <ion-item [routerLink]="'/company-contacts'" routerLinkActive="active">
              <div tabindex="0"></div>
              <ion-icon name="people-outline"  slot="start"></ion-icon>
              <ion-label>
                Team
              </ion-label>
            </ion-item>
          </ion-menu-toggle>

          <ion-list-header>Account</ion-list-header>

          <ion-menu-toggle auto-hide="false">
            <ion-item [routerLink]="'/change-password'" routerLinkActive="active">
              <div tabindex="0"></div>
              <ion-icon name="key-outline"  slot="start"></ion-icon>
              <ion-label>
                Change Password
              </ion-label>
            </ion-item>
          </ion-menu-toggle>

          <ion-menu-toggle auto-hide="false">
            <ion-item class="ion-activatable ion-focusable" (click)="logout()" lines="none" tappable detail="false">
              <div tabindex="0"></div>
              <ion-icon name="log-out-outline" slot="start"></ion-icon>
              <ion-label>logout</ion-label>
            </ion-item>
          </ion-menu-toggle>

        </ion-list>
      </ion-content>
    </ion-menu>
    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>

<!-- service worker update message -->

<update-alert  (onRefresh)="onUpdateAlertRefresh()" *ngIf="updatesAvailable" (onClose)="onUpdateAlertClose()"></update-alert>
