<ion-header mode="md">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Sub Companies</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <loading-modal [loading]="loading" type="text-list"></loading-modal>
  
  <ion-list *ngIf="!loading">
    <ion-item *ngFor="let company of companies" (click)="rowSelected(company)" tappable>
      <div tabindex="0"></div>
      <ion-label>{{ company.company_id}} {{ company.company_name}}</ion-label>
    </ion-item>
  </ion-list>

  <ion-infinite-scroll *ngIf="currentPage < pageCount" (ionInfinite)="doInfinite($event)">
    <ion-infinite-scroll-content></ion-infinite-scroll-content>
  </ion-infinite-scroll>

</ion-content>
