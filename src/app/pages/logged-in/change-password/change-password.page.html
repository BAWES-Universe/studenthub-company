<ion-header >
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Change Password</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <form [formGroup]="passwordForm">
    <ion-list>
      <ion-item>
        <ion-label position="floating">Old Password</ion-label>
        <ion-input type="password" formControlName="oldPassword" ></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">New Password</ion-label>
        <ion-input type="password" formControlName="newPassword"></ion-input>
      </ion-item>
    </ion-list>
    <div class="ion-padding">
      <ion-button [disabled]="!this.passwordForm.valid" (click)="save() " color="primary" expands="block">Submit</ion-button>
    </div>
  </form>
</ion-content>
