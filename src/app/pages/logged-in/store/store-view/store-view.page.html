<ion-header>
  <!-- [class.add-border]="borderLimit" class="clear-header"-->
  <ion-toolbar class="desktop-view">
    <ion-buttons slot="start">
      <ion-back-button mode="md" icon="assets/images/icon-back.svg" defaultHref="/view/staff"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
  <ion-toolbar class="desktop-view">
    <ion-title *ngIf="store">{{ store.store_name }}</ion-title>

    <div class="searchbar-wrapper">
      <ion-searchbar debounce="500" placeholder="{{ 'Search Staff...' | translate }}" 
        (ionChange)="searchByName($event)"></ion-searchbar>
    </div>
  </ion-toolbar>

</ion-header>

<ion-content scrollEvents="true" (ionScroll)="logScrolling($event)" class="ion-padding">

  <div class="desktop-view">

    <ion-item tappable *ngFor="let candidate of candidates" 
      (click)="candidateSelected(candidate)" lines="none">
      <div tabindex="0"></div>
      <ion-avatar slot="start">
        <ion-img *ngIf="candidate.candidate_personal_photo"
          src="{{ awsService.cloudinaryUrl + 'candidate-photo/' + candidate.candidate_personal_photo }}"
          (ionError)="onImageError(candidate)"></ion-img>
        <ion-img *ngIf="!candidate.candidate_personal_photo" src="/assets/icon.png"></ion-img>
      </ion-avatar>
      <ion-label  class="candidate_name">
        <h5>{{ candidate.candidate_name? candidate.candidate_name: candidate.candidate_name_ar }}</h5>
        <!-- <p>{{ store.store_name }} @ {{ store.company.company_name }}</p> -->
        <ion-note *ngIf="candidate.storeAssignmentRequest">
          <ng-container *ngIf="candidate.storeAssignmentRequest.store_id">{{ "Requested to change store" | translate }}</ng-container>
          <ng-container *ngIf="!candidate.storeAssignmentRequest.store_id">{{ "Requested to remove" | translate }}</ng-container>
        </ion-note>
      </ion-label>
      <!--  
        *ngIf="!candidate.storeAssignmentRequest"-->
      <ion-button fill="clear" slot="end" (click)="candidateOptions($event, candidate)">
        <!-- stores.length > 1 && -->
        <ion-icon name="ellipsis-vertical-outline"></ion-icon>
      </ion-button>
    </ion-item>

    <no-items *ngIf="candidates.length == 0 && !loading" message="~ No Employees Assigned Yet! ~"></no-items>

    <loading-modal [loading]="loading" type="candidate-list"></loading-modal>

    <ion-infinite-scroll *ngIf="currentPage < pageCount" (ionInfinite)="doInfinite($event)">
      <ion-infinite-scroll-content>
      </ion-infinite-scroll-content>
    </ion-infinite-scroll>

  </div>

</ion-content>
