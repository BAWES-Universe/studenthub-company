  <ion-split-pane content-id="main-content" contentId="main-content">
    <ion-menu contentId="main-content"  #menu menuId="menu">
      <ion-header class="menu-header">
        <ion-toolbar class=" navi-header ion-text-center">
          <img class='logo' src="assets/icon.png" />
          <h3>Studenthub Payroll</h3>
          <h3>Welcome {{auth.name}}</h3>
        </ion-toolbar>
      </ion-header>
      <ion-content>
        <ion-list lines="none">
          <ion-item [routerLink]="'/account'" routerLinkActive="active">
              <ion-icon name="person-outline" slot="start"></ion-icon>
              <ion-label>
                Company Profile
              </ion-label>
            </ion-item>
            <ion-item [routerLink]="'/store-list'" routerLinkActive="active">
              <ion-icon name="list-outline"  slot="start"></ion-icon>
              <ion-label>
                Your Stores
              </ion-label>
            </ion-item>
              <ion-item [routerLink]="'/company-contacts'" routerLinkActive="active">
                <ion-icon name="people-outline"  slot="start"></ion-icon>
              <ion-label>
                Team
              </ion-label>
            </ion-item>
            <ion-item class="ion-activatable ion-focusable"  lines="none" tappable detail="false">
              <ion-icon name="log-out-outline" slot="start"></ion-icon>
              <ion-label>logout</ion-label>
            </ion-item>
        </ion-list>
      </ion-content>

    </ion-menu>
      <ion-tabs #tabRef id="main-content" [class.plt-mobile]="platform.is('mobile')">

        <ion-header>
          <company-header></company-header>
        </ion-header>

        <ion-tab-bar class="tabs desktop" #mainTabs slot="top" *ngIf="!platform.is('mobile')">
          <ion-tab-button class="tab-button" layout="icon-start" tab="requests">
            <ion-icon name="chatbubble-outline"></ion-icon>
            <ion-label>Requests</ion-label>
          </ion-tab-button>
          <ion-tab-button class="tab-button" layout="icon-start" tab="cv-search">
            <ion-icon name="people-outline" ></ion-icon>
            <ion-label>CV Search</ion-label>
          </ion-tab-button>
          <ion-tab-button class="tab-button" layout="icon-start" tab="staff">
            <ion-icon name="person-outline"></ion-icon>
            <ion-label>Assigned Staff</ion-label>
    <!--        <ion-badge *ngIf="conversationAlert > 0">{{ conversationAlert }}</ion-badge>-->
          </ion-tab-button>
          <ion-tab-button class="tab-button" layout="icon-start" tab="transfer">
            <ion-icon name="repeat-outline"></ion-icon>
            <ion-label>Transfers</ion-label>
    <!--        <ion-badge *ngIf="applicationCount > 0">{{ applicationCount }}</ion-badge>-->
          </ion-tab-button>
        </ion-tab-bar>

        <ion-tab-bar class="tabs mobile-view" #mainTabs slot="bottom" *ngIf="platform.is('mobile')">
          <ion-tab-button class="tab-button" layout="icon-top" tab="requests">
            <ion-icon name="chatbubble-outline"></ion-icon>
            <ion-label>Requests</ion-label>
          </ion-tab-button>
          <ion-tab-button class="tab-button" layout="icon-top" tab="cv-search">
            <ion-icon name="people-outline" ></ion-icon>
            <ion-label>CV Search</ion-label>
          </ion-tab-button>
          <ion-tab-button class="tab-button" layout="icon-top" tab="staff" >
            <ion-icon name="person-outline"></ion-icon>
            <ion-label>Assigned Staff</ion-label>
    <!--        <ion-badge *ngIf="conversationAlert > 0">{{ conversationAlert }}</ion-badge>-->
          </ion-tab-button>
          <ion-tab-button class="tab-button" layout="icon-top" tab="transfer">
            <ion-icon name="repeat-outline"></ion-icon>
            <ion-label>Transfers</ion-label>
    <!--        <ion-badge *ngIf="applicationCount > 0">{{ applicationCount }}</ion-badge>-->
          </ion-tab-button>
        </ion-tab-bar>
      </ion-tabs>
  </ion-split-pane>
