<ion-header>
  <ion-toolbar class="desktop-view">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/"></ion-back-button>
    </ion-buttons>
    <ion-title class="candidate_name">
      {{ "Time log" | translate }}
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
<ion-progress-bar *ngIf="loading" type="indeterminate"></ion-progress-bar>

  <div class="max-width desktop-view">
    <ion-list *ngIf="candidateWorkingHourData">
      <ion-item [routerLink]="['/log-hour-list',this.candidate_id,hours.date]" *ngFor="let hours of candidateWorkingHourData">
          <ion-label>
            {{hours.date}}<br/>
            <small>{{hours.total_time | timeSpent}}</small>
          </ion-label>
      </ion-item>
    </ion-list>
    <p *ngIf="candidateWorkingHourData && candidateWorkingHourData.length == 0">
      {{ "No record found" | translate }}
    </p>

    <ion-infinite-scroll *ngIf="currentPage < pageCount" (ionInfinite)="doInfinite($event)">
      <ion-infinite-scroll-content>
      </ion-infinite-scroll-content>
    </ion-infinite-scroll>
  </div>
</ion-content>
