<ion-header >
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button>
        <ion-menu-button></ion-menu-button>
      </ion-button>
    </ion-buttons>
    <ion-title>Employees</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-list *ngIf="candidates && !loading">
    <ion-item tappable (click)="rowSelected(candidate)" *ngFor="let candidate of candidates">
      <div tabindex="0"></div>
      <ion-avatar slot="start">
        <ion-img *ngIf="candidate.candidate_personal_photo" src="{{ aws.cloudinaryUrl + 'candidate-photo/' + candidate.candidate_personal_photo }}" (ionError)="onImageError(candidate)"></ion-img>
        <ion-img *ngIf="!candidate.candidate_personal_photo" src="/assets/icon.png"></ion-img>
      </ion-avatar>
      <ion-label  class="candidate_name">
        {{ candidate.candidate_name? candidate.candidate_name: candidate.candidate_name_ar }}<br/>
        <small *ngIf="candidate.store_id > 0" >{{ candidate.store.store_name }} @ {{ candidate.company.company_name }}</small>
      </ion-label>
    </ion-item>
  </ion-list>

  <loading-modal [loading]="loading" type="candidate-list"></loading-modal>

</ion-content>
