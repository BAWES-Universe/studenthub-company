<ion-header >
  <ion-navbar>
    <button ion-button menuToggle="left">
      <ion-icon name="menu"></ion-icon>
    </button>

    <ion-title>Employees</ion-title>
  </ion-navbar>
</ion-header>

<ion-content >
  <ion-list>
    <ion-item-sliding *ngFor="let candidateMember of candidates">
      <button ion-item (click)="rowSelected(candidateMember)">
    <ion-avatar item-left>
        <img src="https://sh-payroll.s3.eu-west-2.amazonaws.com/{{candidateMember.candidate_personal_photo}}">
    </ion-avatar>
        {{ candidateMember.candidate_name}}
      </button>
    </ion-item-sliding>
  </ion-list>

  <ion-row text-center>
    <div class="pagination-wrapper">
      <button *ngFor="let page of pages" ion-button small color="{{ pageLinkColor(page) }}" (click)="loadData(page)">
        {{ page }}
      </button>
    </div>
  </ion-row>

</ion-content>

<ion-footer>
  <!--  <button ion-button full (click)="create()">
    Create
  </button> -->
</ion-footer>
