<ion-header >
  <ion-navbar>
    <button ion-button menuToggle="left">
      <ion-icon name="menu"></ion-icon>
    </button>

    <ion-title>Company Candidates</ion-title>
  </ion-navbar>
</ion-header>

<ion-content >
  <ion-list>
    <ion-item-sliding *ngFor="let candidateMember of candidate">
      <button ion-item (click)="rowSelected(candidateMember)">
        {{ candidateMember.candidate_name}}
      </button>
    </ion-item-sliding>
  </ion-list>
</ion-content>
