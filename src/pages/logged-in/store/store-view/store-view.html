<ion-header>
  <ion-navbar>
    <button ion-button menuToggle="left">
      <ion-icon name="menu"></ion-icon>
    </button>
    <ion-title>{{ store.store_name }}</ion-title>
  </ion-navbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item-divider color="light"><b>Assigned Employees</b></ion-item-divider>
    <button ion-item 
      *ngFor="let candidateMember of store.candidates"
      (click)="candidateSelected(candidateMember)">
      <ion-avatar item-left>
          <img src="https://sh-payroll.s3.eu-west-2.amazonaws.com/{{candidateMember.candidate_personal_photo_thumb}}">
      </ion-avatar>
      {{ candidateMember.candidate_name}}
    </button>
  </ion-list>

</ion-content>
