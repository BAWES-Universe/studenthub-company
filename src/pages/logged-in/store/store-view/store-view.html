<ion-header>
  <ion-navbar>
    <button ion-button menuToggle="left">
      <ion-icon name="menu"></ion-icon>
    </button>

    <ion-title>{{ store.store_name }}</ion-title>

  </ion-navbar>
</ion-header>

<ion-content padding>
  <h5>Id</h5>
  <p>{{ store.store_id }}</p>

  <h5>Store</h5>
  <p>{{ store.store_name }}</p>

  <h5>Candidate</h5>
  <ion-list>
    <ion-item-sliding *ngFor="let candidateMember of store.candidates">
      <button ion-item (click)="candidateSelected(candidateMember)">
        {{ candidateMember.candidate_name}}
      </button>
    </ion-item-sliding>
  </ion-list>

</ion-content>
