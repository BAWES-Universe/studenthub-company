<ion-header>
  <ion-navbar>
    <button ion-button menuToggle="left">
      <ion-icon name="menu"></ion-icon>
    </button>

    <ion-title>Transfer List</ion-title>
  </ion-navbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item-sliding *ngFor="let transferMember of invoices |  orderBy:'invoice_created_at'">
      {{transferMember.invoice_status}}
      <ion-item>
        <span *ngIf="transferMember.invoice_status=='10'"> Transfer Initiated </span>
        <span *ngIf="transferMember.invoice_status=='1'"> Payment Sent </span>
        <span *ngIf="transferMember.invoice_status=='2'"> Payment Received </span>
        <span *ngIf="transferMember.invoice_status=='3'"> Salary distribution in progress </span>
        <span *ngIf="transferMember.invoice_status=='4'"> Transfer Completed </span>
        <span *ngIf="transferMember.invoice_status=='5'"> Transfer Locked </span>

        <button ion-item [ngClass]="{'my-class': transferMember.invoice_status=='1' }" (click)="transferDetails(transferMember.invoice_id,transferMember.invoice_status)">  
        Transfer Id : {{ transferMember.invoice_id}}<br>     
        Transfer Created: {{ transferMember.invoice_created_at}}<br>
        Transfer Updated: {{ transferMember.invoice_updated_at}}  <br>  
        Total: {{ transferMember.total}}  
        </button>
      </ion-item>
    </ion-item-sliding>    
  </ion-list>

  <ion-row text-center>
    <div class="pagination-wrapper">
      <button *ngFor="let page of pages" ion-button small color="{{ pageLinkColor(page) }}" (click)="loadData(page)">
        {{ page }}
      </button>
    </div>
  </ion-row>

</ion-content>
<ion-footer>
  <button ion-button full (click)="create()">
    Initiate Transfer
  </button>
</ion-footer>
