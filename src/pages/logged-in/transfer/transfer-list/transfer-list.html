
<ion-header>
  <ion-navbar>
    <button ion-button menuToggle="left">
      <ion-icon name="menu"></ion-icon>
    </button>

    <ion-title (click)="organiseTransfers()">Transfer List</ion-title>
  </ion-navbar>
</ion-header>

<ion-content>

  <div padding>
   <ion-segment [(ngModel)]="inProgress">
        <ion-segment-button value="In Progress">
          In Progress
        </ion-segment-button>
        <ion-segment-button value="completed">
          Completed
        </ion-segment-button>
      </ion-segment>
  </div>

  <div [ngSwitch]="inProgress">
    <ion-list *ngSwitchCase="'In Progress'">

      <div *ngIf="lockTransfers.length > 0">
        <ion-item-divider color="light"><b>Waiting for your payment</b></ion-item-divider>
        <ion-item-sliding *ngFor="let transfer of lockTransfers">
          <button ion-item (click)="transferDetails(transfer.transfer_id)">  
              {{transfer.transfer_created_at}}
              <ion-badge item-right>KWD {{transfer.company_total}}</ion-badge>
          </button>
          <ion-item-options>
              <button ion-button (click)="transferDetails(transfer.transfer_id)">
                View
              </button>
              <button ion-button color="danger" (click)="delete(transfer.transfer_id)"
                *ngIf="transfer && (transfer.transfer_status=='10' || transfer.transfer_status=='5')">
                Delete
              </button>
            </ion-item-options>
        </ion-item-sliding>  
      </div>  

      <div *ngIf="draftTransfers.length > 0">
        <ion-item-divider color="light"><b>Draft</b></ion-item-divider>
        <ion-item-sliding *ngFor="let transfer of draftTransfers">
          <button ion-item (click)="transferDetails(transfer.transfer_id)">  
              {{transfer.transfer_created_at}}
              <ion-badge item-right>KWD {{transfer.company_total}}</ion-badge>
          </button>
          <ion-item-options>
              <button ion-button (click)="transferDetails(transfer.transfer_id)">
                View
              </button>
              <button ion-button color="danger" (click)="delete(transfer.transfer_id)"
                *ngIf="transfer && (transfer.transfer_status=='10' || transfer.transfer_status=='5')">
                Delete
              </button>
            </ion-item-options>
        </ion-item-sliding>  
      </div>  

      <div *ngIf="inProgressTransfers.length > 0">
        <ion-item-divider color="light"><b>In Progress</b></ion-item-divider>
        <ion-item-sliding *ngFor="let transfer of inProgressTransfers">
          <button ion-item (click)="transferDetails(transfer.transfer_id)">  
              {{transfer.transfer_created_at}}
              <ion-badge item-right>KWD {{transfer.company_total}}</ion-badge>
          </button>
          <ion-item-options>
              <button ion-button (click)="transferDetails(transfer.transfer_id)">
                View
              </button>
              <button ion-button color="danger" (click)="delete(transfer.transfer_id)"
                *ngIf="transfer && (transfer.transfer_status=='10' || transfer.transfer_status=='5')">
                Delete
              </button>
            </ion-item-options>
        </ion-item-sliding>  
      </div>  

      <div *ngIf="sentTransfers.length > 0">
        <ion-item-divider color="light"><b>Payment Sent</b></ion-item-divider>
        <ion-item-sliding *ngFor="let transfer of sentTransfers">
          <button ion-item (click)="transferDetails(transfer.transfer_id)">  
              {{transfer.transfer_created_at}}
              <ion-badge item-right>KWD {{transfer.company_total}}</ion-badge>
          </button>
          <ion-item-options>
              <button ion-button (click)="transferDetails(transfer.transfer_id)">
                View
              </button>
              <button ion-button color="danger" (click)="delete(transfer.transfer_id)"
                *ngIf="transfer && (transfer.transfer_status=='10' || transfer.transfer_status=='5')">
                Delete
              </button>
           </ion-item-options>
        </ion-item-sliding>  
      </div>  
    </ion-list>

    <ion-list *ngSwitchCase="'completed'">
        <ion-item-divider color="light"><b>Completed</b></ion-item-divider>
        <ion-item *ngIf="completedTransfers.length == 0">There is no Completed Payment</ion-item>
        <div *ngIf="completedTransfers.length > 0">
          <ion-item-sliding *ngFor="let transfer of completedTransfers">
            <button ion-item (click)="transferDetails(transfer.transfer_id)">  
                {{transfer.transfer_created_at}}
                <ion-badge item-right>KWD {{transfer.company_total}}</ion-badge>
            </button>
            <ion-item-options>
              <button ion-button (click)="transferDetails(transfer.transfer_id)">
                View
              </button>
              <button ion-button color="danger" (click)="delete(transfer.transfer_id)"
                *ngIf="transfer && (transfer.transfer_status=='10' || transfer.transfer_status=='5')">
                Delete
              </button>
            </ion-item-options>
          </ion-item-sliding>  
        </div>  
    </ion-list>
  </div>
      
  <ion-row text-center>
    <div class="pagination-wrapper">
      <button *ngFor="let page of pages" ion-button small color="{{ pageLinkColor(page) }}" (click)="loadData(page)">
        {{ page }}
      </button>
    </div>
  </ion-row>
</ion-content>
<ion-footer>
  <button ion-button block (click)="createNewTransfer()">
    Initiate Transfer
  </button>
</ion-footer>
