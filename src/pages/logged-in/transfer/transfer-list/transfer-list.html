<ion-header>
  <ion-navbar>
    <button ion-button menuToggle="left">
      <ion-icon name="menu"></ion-icon>
    </button>

    <ion-title>Transfer List</ion-title>
  </ion-navbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item-sliding *ngFor="let transferMember of transfer |  orderBy:'transfer_id'">
      <button ion-item (click)="transferDetails(transferMember.transfer_id,transferMember.edit_transfer_status)">
        Transfer Status:{{ transferMember.transfer_status}}<br>
        Transfer Created: {{ transferMember.transfer_created_at}}<br>
        Transfer Updated: {{ transferMember.transfer_updated_at}}  <br>         
           <b>{{transferMember.edit_transfer_status}}  </b>     
      </button>
      <ion-item-options side="right">
        <button ion-button color="alert" (click)="transferDetails(transferMember.transfer_id)">
          <ion-icon name="trash"></ion-icon>
          Details
        </button>
      </ion-item-options>

    </ion-item-sliding>
  </ion-list>
</ion-content>
<ion-footer>
  <button ion-button full (click)="create()">
    Initiate Transfer
  </button>
</ion-footer>
