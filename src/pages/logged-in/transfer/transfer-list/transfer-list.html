<ion-header>
  <ion-navbar>
    <button ion-button menuToggle="left">
      <ion-icon name="menu"></ion-icon>
    </button>

    <ion-title>Transfer List</ion-title>
  </ion-navbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item-sliding *ngFor="let transferMember of transfer">
      <button ion-item>
        {{ transferMember.company_name}}
      </button>  
    </ion-item-sliding>
</ion-list>
</ion-content>

<ion-footer>
  <button ion-button full (click)="create()">
    Initiate Transfer
  </button>
</ion-footer>
