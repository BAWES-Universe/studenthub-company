<ion-header>
  <ion-navbar>
    <button ion-button menuToggle="left">
      <ion-icon name="menu"></ion-icon>
    </button>
    <ion-title>Transfer Details</ion-title>
    <ion-buttons right *ngIf="invoiceDetails && transferStatus==='10'">
      <button ion-button clear color="primary" (click)="edit(invoiceDetails)">
        Edit
      </button>
    </ion-buttons>
  </ion-navbar>
</ion-header>

<ion-content padding>
  <ion-list *ngIf="invoiceDetails">

    <button ion-item>
      
      Company name : {{ invoiceDetails.company_name}}<br> 
      Company email : {{ invoiceDetails.company_email}}<br> 

      Transfer Created : {{ invoiceDetails.invoice_created_at}}<br> 
      Transfer Updated :{{ invoiceDetails.invoice_updated_at}}<br>    
      Total:{{ invoiceDetails.company_total}}<br> 

      Invoice Status:
      <span *ngIf="invoiceDetails.invoice_status=='10'"> Draft </span>
      <span *ngIf="invoiceDetails.invoice_status=='1'"> Payment Sent </span>
      <span *ngIf="invoiceDetails.invoice_status=='2'"> Payment Received </span>
      <span *ngIf="invoiceDetails.invoice_status=='3'"> Salary distribution in progress </span>
      <span *ngIf="invoiceDetails.invoice_status=='4'"> Transfer Completed </span>
      <span *ngIf="invoiceDetails.invoice_status=='5'"> Transfer Locked </span>
      <br>

    </button>

    <ion-item-group *ngFor="let group of invoiceDetails.candidates | store_name">
      <ion-item-divider><b>{{group.name}}</b></ion-item-divider>
      <button *ngFor="let resource of group.resources" ion-item>        
         <ion-row>
            <ion-col > Candidate Name:</ion-col>
             <ion-col >{{resource.candidate_name}}</ion-col>
        </ion-row>
      <ion-row>
      <ion-col > Candidate Email:</ion-col>
        <ion-col >{{resource.candidate_email}}</ion-col>
     </ion-row>

      <!--<ion-row>
      <ion-col > hourly_rate:</ion-col>
        <ion-col>{{resource.hourly_rate}}</ion-col>
     </ion-row>-->

      <ion-row>
      <ion-col > Hours:</ion-col>
        <ion-col>{{resource.hours}}</ion-col>
     </ion-row>

      <ion-row>
      <ion-col > Bonus:</ion-col>
        <ion-col>{{resource.bonus}}</ion-col>
     </ion-row>

      <ion-row>
      <ion-col > Transfer Cost:</ion-col>
        <ion-col>{{resource.transfer_cost}}</ion-col>
     </ion-row>

       <ion-row>
      <ion-col > Total:</ion-col>
        <ion-col >{{ totalCost(2, resource.hours, resource.bonus, resource.transfer_cost) }}</ion-col>
     </ion-row>

      </button>
      <br>
    </ion-item-group>

  </ion-list>
</ion-content>

<ion-footer *ngIf="invoiceDetails && transferStatus==='10'">
  <button ion-button full (click)="transferLock(invoiceDetails.invoice_id)">
   Lock Transfer
  </button>
</ion-footer>


<ion-footer *ngIf="invoiceDetails && transferStatus==='5'">
  <button ion-button full (click)="paymentSent(invoiceDetails.invoice_id)">
    Payment Sent
  </button>
</ion-footer>


<ion-footer *ngIf="invoiceDetails && transferStatus==='4'">
  <button ion-button full (click)="generateInvoice(invoiceDetails.invoice_id)">
    Generate Invoice
  </button>
</ion-footer>
