<ion-header>
  <ion-navbar>
    <ion-title>{{ operation? operation : "New Transfer" }}</ion-title>
    <ion-buttons right>
      <button ion-button clear color="primary" (click)="save()">
        Save
      </button>
    </ion-buttons>
  </ion-navbar>
</ion-header>

<ion-content>

  <form>

    <ion-card *ngFor="let candidate of candidatesObj; let i = index">
      <ion-item>
        <ion-avatar item-left>
          <img src="https://sh-payroll.s3.eu-west-2.amazonaws.com/{{candidate.candidate_personal_photo_thumb}}">
        </ion-avatar>
        <h2>{{ candidate.candidate_name }}</h2>
      </ion-item>

      <ion-input type="number" placeholder="Hours" #hoursInput
        [(ngModel)]="hours[i]" [ngModelOptions]="{standalone: true}"></ion-input>
      <ion-input type="number" placeholder="Bonus (KWD)" #bonusInput
        [(ngModel)]="bonus[i]" [ngModelOptions]="{standalone: true}"></ion-input>
      
      <p>KWD {{ parseNumber(hoursInput.value) + parseNumber(bonusInput.value) }}</p>

    </ion-card>
      
  </form>

</ion-content>
